<div class="container mt-4">

  <h2 class="mb-3">

    Users

  </h2>

  <div
    *ngIf="loading"
    class="alert alert-info">

    Loading users...

  </div>

  <div class="row mb-3">

  <!-- SEARCH -->

  <div class="col-md-6">

    <input
      type="text"

      class="form-control"

      placeholder="Search users..."

      [(ngModel)]="searchText"

      (input)="onSearch()"
    />

  </div>

  <!-- SORT -->

  <div class="col-md-3">

    <select
      class="form-select"

      [(ngModel)]="sortOrder"

      (change)="onSortChange()">

      <option value="asc">

        A-Z

      </option>

      <option value="desc">

        Z-A

      </option>

    </select>

  </div>

</div>

  <!-- USER CARDS -->

<div
  *ngIf="!loading"
  class="row g-4">

  <div
    *ngFor="let user of paginatedUsers"
    class="col-lg-4 col-md-6">

    <div
      class="card border-0 shadow-lg h-100 user-card">

      <div
        class="card-body d-flex flex-column text-center">

        <!-- AVATAR -->

        <div class="mb-3">

          <div class="user-avatar">

            {{ user.userName.charAt(0) }}

          </div>

        </div>

        <!-- NAME -->

        <h4 class="fw-bold mb-2">

          {{ user.userName }}

        </h4>

        <!-- EMAIL -->

        <p class="text-secondary mb-3">

          {{ user.emailId }}

        </p>

        <!-- ROLE -->

        <div class="mt-auto">

          <span
            class="badge px-3 py-2"

            [ngClass]="
              user.role === 'Admin'
              ? 'bg-danger'
              : 'bg-success'
            ">

            {{ user.role }}

          </span>

        </div>

      </div>

    </div>

  </div>

</div>

  <div
  class="d-flex
         justify-content-center
         align-items-center
         mt-4">

  <button
    class="btn btn-outline-primary me-2"

    (click)="previousPage()"

    [disabled]="
      currentPage === 1
    ">

    Previous

  </button>

  <button

    *ngFor="let page of pages"

    class="btn me-2"

    [ngClass]="
      page === currentPage
      ? 'btn-primary'
      : 'btn-outline-primary'
    "

    (click)="goToPage(page)">

    {{ page }}

  </button>

  <button
    class="btn btn-outline-primary"

    (click)="nextPage()"

    [disabled]="
      currentPage === totalPages
    ">

    Next

  </button>

</div>

</div>
