<div class="container mt-4">

  <div
    class="d-flex justify-content-between align-items-center mb-3">

    <h2>Events</h2>

    <div
      *ngIf="successMessage"
      class="alert alert-success">

      {{ successMessage }}

    </div>

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">

      {{ errorMessage }}

    </div>       

    <div *ngIf="role === 'Admin'">

      <a
      routerLink="/events/create"
      class="btn btn-primary">

      Add Event

      </a>
    </div>

  </div>

  <div
    *ngIf="loading"
    class="alert alert-info">

    Loading events...

  </div>

  <div class="row mb-3">

  <!-- SEARCH -->

  <div class="col-md-6">

    <input
      type="text"
      class="form-control"
      placeholder="Search events..."

      [(ngModel)]="searchText"

      (input)="onSearch()"
    />

  </div>

  <!-- SORT -->

  <div class="col-md-3">

    <select
      class="form-select"

      [(ngModel)]="sortOrder"

      (change)="onSortChange()">

      <option value="asc">

        A-Z

      </option>

      <option value="desc">

        Z-A

      </option>

      </select>

    </div>

  </div>

  <!-- EVENT CARDS -->

<div
  *ngIf="!loading"
  class="row g-4">

  <div
    *ngFor="let event of paginatedEvents"
    class="col-lg-4 col-md-6">

    <div
      class="card border-0 shadow-lg h-100 event-card">

      <div
        class="card-body d-flex flex-column">

        <!-- TITLE -->

        <h4 class="fw-bold mb-3">

          {{ event.eventName }}

        </h4>

        <!-- CATEGORY -->

        <div class="mb-3">

          <span class="badge bg-primary">

            {{ event.categoryName }}

          </span>

        </div>

        <!-- DATE -->

        <p class="mb-2">

          <strong>Date:</strong>

          {{ event.eventDate | date }}

        </p>

        <!-- STATUS -->

        <p class="mb-4">

          <strong>Status:</strong>

          <span
            class="badge"

            [ngClass]="
              event.status === 'Upcoming'
              ? 'bg-success'
              : 'bg-secondary'
            ">

            {{ event.status }}

          </span>

        </p>

        <!-- ACTIONS -->

        <div class="mt-auto">

          <!-- ADMIN -->

          <ng-container
            *ngIf="role === 'Admin'">

            <button
              class="btn btn-warning me-2"

              [routerLink]="[
                '/events/edit',
                event.eventId
              ]">

              Edit

            </button>

            <button
              class="btn btn-danger"

              (click)="deleteEvent(
                event.eventId
              )">

              Delete

            </button>

          </ng-container>

          <!-- PARTICIPANT -->

          <ng-container
            *ngIf="
              role === 'Participant'
            ">

            <button
              class="btn btn-success me-2 mb-2"

              (click)="register(
                event.eventId
              )">

              Register

            </button>

            <button
              class="btn btn-info me-2 mb-2"

              (click)="unregister(
                event.eventId
              )">

              Unregister

            </button>

            <button
              class="btn btn-primary mb-2"

              (click)="markAttendance(
                event.eventId
              )">

              Attendance

            </button>

          </ng-container>

        </div>

      </div>

    </div>

  </div>

</div>

  <div
    class="d-flex
         justify-content-center
         align-items-center
         mt-4">

   <!-- PREVIOUS -->

   <button
     class="btn btn-outline-primary me-2"

      (click)="previousPage()"

     [disabled]="
      currentPage === 1
       ">

      Previous

    </button>

   <!-- PAGE NUMBERS -->

    <button

      *ngFor="let page of pages"

      class="btn me-2"

      [ngClass]="
      page === currentPage
      ? 'btn-primary'
      : 'btn-outline-primary'
      "

      (click)="goToPage(page)">

      {{ page }}

    </button>

    <!-- NEXT -->

    <button
      class="btn btn-outline-primary"

      (click)="nextPage()"

      [disabled]="
      currentPage === totalPages
      ">

      Next

    </button>

  </div>

</div>
