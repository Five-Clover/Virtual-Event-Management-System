<div class="container mt-4">

  <div class="card shadow">

    <div class="card-body">

      <h2 class="mb-4">

        {{
          isEditMode
          ? 'Edit Session'
          : 'Create Session'
        }}

      </h2>

      <div
        *ngIf="errorMessage"
        class="alert alert-danger">

        {{ errorMessage }}

      </div>

      <div
        *ngIf="successMessage"
        class="alert alert-success">

        {{ successMessage }}
      </div>

      <form
        (ngSubmit)="saveSession()">

        <div class="mb-3">

          <label class="form-label">
            Title
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="model.title"
            name="title"
            required>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Event
          </label>

          <select
            class="form-select"
            [(ngModel)]="model.eventId"
            name="eventId"
            required>

            <option value="">
              Select Event
            </option>

            <option
              *ngFor="
                let event
                of events
              "
              [value]="event.eventId">

              {{ event.eventName }}

            </option>

          </select>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Speaker
          </label>

          <select
            class="form-select"
            [(ngModel)]="model.speakerId"
            name="speakerId"
            required>

            <option value="">
              Select Speaker
            </option>

            <option
              *ngFor="
                let speaker
                of speakers
              "
              [value]="speaker.speakerId">

              {{ speaker.speakerName }}

            </option>

          </select>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Session Start
          </label>

          <input
            type="datetime-local"
            class="form-control"
            [(ngModel)]="model.sessionStart"
            name="sessionStart"
            required>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Session End
          </label>

          <input
            type="datetime-local"
            class="form-control"
            [(ngModel)]="model.sessionEnd"
            name="sessionEnd"
            required>

        </div>

        <div class="mb-3">

          <label class="form-label">
            Session URL
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="model.sessionUrl"
            name="sessionUrl">

        </div>

        <div class="mb-3">

          <label class="form-label">
            Description
          </label>

          <textarea
            class="form-control"
            rows="4"
            [(ngModel)]="model.description"
            name="description">

          </textarea>

        </div>

        <button
          type="submit"
          class="btn btn-success">

          Save

        </button>

      </form>

    </div>

  </div>

</div>
