<div class="container mt-4">

  <div
    class="d-flex justify-content-between align-items-center mb-3">

    <h2>Sessions</h2>

    <div
      *ngIf="successMessage"
      class="alert alert-success">

      {{ successMessage }}

    </div>

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">

      {{ errorMessage }}

    </div> 

    <a
      routerLink="/sessions/create"
      class="btn btn-primary">

      Add Session

    </a>

  </div>

  <div
    *ngIf="loading"
    class="alert alert-info">

    Loading sessions...

  </div>

  <div class="row mb-3">

  <!-- SEARCH -->

  <div class="col-md-6">

    <input
      type="text"

      class="form-control"

      placeholder="Search sessions..."

      [(ngModel)]="searchText"

      (input)="onSearch()"
    />

  </div>

  <!-- SORT -->

  <div class="col-md-3">

    <select
      class="form-select"

      [(ngModel)]="sortOrder"

      (change)="onSortChange()">

      <option value="asc">

        A-Z

      </option>

      <option value="desc">

        Z-A

      </option>

    </select>

  </div>

</div>

  <!-- SESSION CARDS -->

<div
  *ngIf="!loading"
  class="row g-4">

  <div
    *ngFor="let session of paginatedSessions"
    class="col-lg-4 col-md-6">

    <div
      class="card border-0 shadow-lg h-100 session-card">

      <div
        class="card-body d-flex flex-column">

        <!-- TITLE -->

        <h4 class="fw-bold mb-3">

          {{ session.title }}

        </h4>

        <!-- EVENT -->

        <div class="mb-3">

          <span class="badge bg-primary me-2">

            {{ session.eventName }}

          </span>

        </div>

        <!-- SPEAKER -->

        <p class="mb-2">

          <strong>Speaker:</strong>

          {{ session.speakerName }}

        </p>

        <!-- START -->

        <p class="mb-2">

          <strong>Start:</strong>

          {{ session.sessionStart | date:'medium' }}

        </p>

        <!-- END -->

        <p class="mb-4">

          <strong>End:</strong>

          {{ session.sessionEnd | date:'medium' }}

        </p>

        <!-- ACTIONS -->

        <div class="mt-auto">

          <a
            [routerLink]="[
              '/sessions/edit',
              session.sessionId
            ]"

            class="btn btn-warning me-2">

            Edit

          </a>

          <button
            class="btn btn-danger"

            (click)="deleteSession(
              session.sessionId
            )">

            Delete

          </button>

        </div>

      </div>

    </div>

  </div>

</div>



  <div
  class="d-flex
         justify-content-center
         align-items-center
         mt-4">

  <button
    class="btn btn-outline-primary me-2"

    (click)="previousPage()"

    [disabled]="
      currentPage === 1
    ">

    Previous

  </button>

  <button

    *ngFor="let page of pages"

    class="btn me-2"

    [ngClass]="
      page === currentPage
      ? 'btn-primary'
      : 'btn-outline-primary'
    "

    (click)="goToPage(page)">

    {{ page }}

  </button>

  <button
    class="btn btn-outline-primary"

    (click)="nextPage()"

    [disabled]="
      currentPage === totalPages
    ">

    Next

  </button>

  </div>

</div>
