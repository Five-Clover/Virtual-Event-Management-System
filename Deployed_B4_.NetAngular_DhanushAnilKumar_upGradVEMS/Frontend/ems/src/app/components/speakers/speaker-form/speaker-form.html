<div class="container mt-4">

  <div class="card shadow">

    <div class="card-body">

      <h2 class="mb-4">

        {{
          isEditMode
          ? 'Edit Speaker'
          : 'Create Speaker'
        }}

      </h2>

      <div
        *ngIf="errorMessage"
        class="alert alert-danger">

        {{ errorMessage }}

      </div>

      <div
        *ngIf="successMessage"
        class="alert alert-success">

        {{ successMessage }}
      </div>

      <form
        (ngSubmit)="saveSpeaker()">

        <div class="mb-3">

          <label class="form-label">
            Speaker Name
          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="model.speakerName"
            name="speakerName"
            required>

        </div>

        <button
          type="submit"
          class="btn btn-success">

          Save

        </button>

      </form>

    </div>

  </div>

</div>
