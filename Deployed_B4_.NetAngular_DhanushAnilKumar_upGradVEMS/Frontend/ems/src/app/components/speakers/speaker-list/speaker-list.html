<div class="container mt-4">

  <div
    class="d-flex justify-content-between align-items-center mb-3">

    <h2>Speakers</h2>

    <div
      *ngIf="successMessage"
      class="alert alert-success">

      {{ successMessage }}

    </div>

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">

      {{ errorMessage }}

    </div>  

    <a
      routerLink="/speakers/create"
      class="btn btn-primary">

      Add Speaker

    </a>

  </div>

  <div
    *ngIf="loading"
    class="alert alert-info">

    Loading speakers...

  </div>

  <div class="row mb-3">

  <!-- SEARCH -->

  <div class="col-md-6">

    <input
      type="text"

      class="form-control"

      placeholder="Search speakers..."

      [(ngModel)]="searchText"

      (input)="onSearch()"
    />

  </div>

  <!-- SORT -->

  <div class="col-md-3">

    <select
      class="form-select"

      [(ngModel)]="sortOrder"

      (change)="onSortChange()">

      <option value="asc">

        A-Z

      </option>

      <option value="desc">

        Z-A

      </option>

    </select>

  </div>

</div>

 <!-- SPEAKER CARDS -->

<div
  *ngIf="!loading"
  class="row g-4">

  <div
    *ngFor="let speaker of paginatedSpeakers"
    class="col-lg-4 col-md-6">

    <div
      class="card border-0 shadow-lg h-100 speaker-card">

      <div
        class="card-body d-flex flex-column text-center">

        <!-- AVATAR -->

        <div class="mb-3">

          <div class="speaker-avatar">

            {{ speaker.speakerName.charAt(0) }}

          </div>

        </div>

        <!-- NAME -->

        <h4 class="fw-bold mb-4">

          {{ speaker.speakerName }}

        </h4>

        <!-- ACTIONS -->

        <div class="mt-auto">

          <a
            [routerLink]="[
              '/speakers/edit',
              speaker.speakerId
            ]"

            class="btn btn-warning me-2">

            Edit

          </a>

          <button
            class="btn btn-danger"

            (click)="deleteSpeaker(
              speaker.speakerId
            )">

            Delete

          </button>

        </div>

      </div>

    </div>

  </div>

</div>

  <div
  class="d-flex
         justify-content-center
         align-items-center
         mt-4">

  <button
    class="btn btn-outline-primary me-2"

    (click)="previousPage()"

    [disabled]="
      currentPage === 1
    ">

    Previous

  </button>

  <button

    *ngFor="let page of pages"

    class="btn me-2"

    [ngClass]="
      page === currentPage
      ? 'btn-primary'
      : 'btn-outline-primary'
    "

    (click)="goToPage(page)">

    {{ page }}

  </button>

  <button
    class="btn btn-outline-primary"

    (click)="nextPage()"

    [disabled]="
      currentPage === totalPages
    ">

    Next

  </button>

</div>

</div>
