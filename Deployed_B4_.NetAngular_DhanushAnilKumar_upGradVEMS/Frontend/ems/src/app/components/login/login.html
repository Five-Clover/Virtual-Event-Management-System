<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-body">

          <h2 class="text-center mb-4">
            EMS Login
          </h2>

          <div
            *ngIf="errorMessage"
            class="alert alert-danger">

            {{ errorMessage }}

          </div>

          <div
            *ngIf="successMessage"
            class="alert alert-success">

            {{ successMessage }}
            
          </div>

          <form (ngSubmit)="onLogin()">

            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                [(ngModel)]="model.emailId"
                name="emailId"
                required>

            </div>

            <div class="mb-3">

              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                [(ngModel)]="model.password"
                name="password"
                required>

            </div>

            <button
              type="submit"
              class="btn btn-primary w-100">

              Login

            </button>

          </form>

          <div class="text-center mt-3">

            <a routerLink="/register">
              Create account
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
